name: Android Release AAB

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LOKTANTRA_UPLOAD_STORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/loktantra-upload-key.jks
          chmod 600 android/app/loktantra-upload-key.jks

      - name: Configure Gradle signing
        env:
          STORE_PASSWORD: ${{ secrets.LOKTANTRA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOKTANTRA_UPLOAD_KEY_ALIAS }}
        run: |
          {
            echo "LOKTANTRA_UPLOAD_STORE_FILE=loktantra-upload-key.jks"
            echo "LOKTANTRA_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "LOKTANTRA_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
          } >> android/gradle.properties

      - name: Validate release keystore
        env:
          STORE_PASSWORD: ${{ secrets.LOKTANTRA_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOKTANTRA_UPLOAD_KEY_ALIAS }}
        run: |
          keytool -list -v -keystore android/app/loktantra-upload-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Release keystore validation: OK"
      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: loktantra-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
